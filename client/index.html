<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kitchen Chaos Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
    }

    /* Crisp HD canvas rendering */
    #game-container canvas {
      max-width: 100vw !important;
      max-height: 100vh !important;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Fullscreen Floating Toggle */
    #fs-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10000;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #64748b;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #fs-btn:active {
      transform: scale(0.95);
      background: #2563eb;
    }

    /* IN-GAME HTML MODAL (Stops propagation to canvas underneath!) */
    #input-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .modal-box {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      color: #ffffff;
      position: relative;
    }

    .modal-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #fbbf24;
    }

    .modal-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 4px;
      border-radius: 10px;
      border: 2px solid #475569;
      background: #0f172a;
      color: #38bdf8;
      outline: none;
      margin-bottom: 22px;
    }

    .modal-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .modal-btn-confirm {
      background: #2563eb;
      color: #ffffff;
    }

    .modal-btn-cancel {
      background: #475569;
      color: #ffffff;
    }

    #orientation-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111422;
      color: #ffffff;
      z-index: 99998;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    #orientation-warning .rotate-icon {
      font-size: 48px;
      margin-bottom: 16px;
      animation: rotate-phone 2s infinite ease-in-out;
    }

    @keyframes rotate-phone {
      0%, 10% { transform: rotate(0deg); }
      50%, 60% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

    @media (orientation: portrait) and (max-width: 768px) {
      #orientation-warning {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <button id="fs-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

  <!-- In-game HTML Modal -->
  <div id="input-modal-overlay">
    <div class="modal-box" id="modal-box-inner">
      <div class="modal-title" id="modal-title">NHẬP THÔNG TIN</div>
      <input type="text" id="modal-input" class="modal-input" autocomplete="off" />
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="btn-modal-cancel">HỦY</button>
        <button class="modal-btn modal-btn-confirm" id="btn-modal-confirm">XÁC NHẬN</button>
      </div>
    </div>
  </div>

  <div id="orientation-warning">
    <div class="rotate-icon">📱 ➔ 🔄</div>
    <h2>Vui lòng xoay ngang điện thoại (Landscape)</h2>
    <p style="margin-top: 8px; color: #a0aec0; font-size: 14px;">Để có trải nghiệm nấu bếp tối ưu nhất trên Mobile</p>
  </div>

  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    let currentModalCallback = null;

    const overlay = document.getElementById('input-modal-overlay');
    const modalBox = document.getElementById('modal-box-inner');
    const cancelBtn = document.getElementById('btn-modal-cancel');
    const confirmBtn = document.getElementById('btn-modal-confirm');

    // CRITICAL FIX: Stop all touch/click events from penetrating to the Phaser canvas below!
    ['touchstart', 'touchend', 'touchmove', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click'].forEach(evt => {
      overlay.addEventListener(evt, (e) => {
        e.stopPropagation();
      }, { passive: false });
    });

    cancelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeInputModal();
    });

    confirmBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      confirmInputModal();
    });

    function openInputModal(title, placeholder, defaultValue, inputType, callback) {
      document.getElementById('modal-title').innerText = title;
      const inp = document.getElementById('modal-input');
      inp.placeholder = placeholder || '';
      inp.value = defaultValue || '';
      inp.type = inputType || 'text';
      if (inputType === 'number') {
        inp.setAttribute('inputmode', 'numeric');
        inp.setAttribute('pattern', '[0-9]*');
      } else {
        inp.removeAttribute('inputmode');
        inp.removeAttribute('pattern');
      }
      currentModalCallback = callback;
      overlay.style.display = 'flex';
      setTimeout(() => inp.focus(), 80);
    }

    function closeInputModal() {
      overlay.style.display = 'none';
      currentModalCallback = null;
    }

    function confirmInputModal() {
      const val = document.getElementById('modal-input').value;
      if (currentModalCallback) {
        currentModalCallback(val);
      }
      closeInputModal();
    }

    window.openCustomModal = openInputModal;

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Fullscreen error:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
